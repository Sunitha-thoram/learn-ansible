- name: gather facts
  hosts: local
  connection: local
  tasks:
  - name: print ansible facts
    debug:
      msg: "{{ ansible_facts }}"
  
  - name: print some information
    debug:
      msg: |
        os_family: {{ ansible_facts['os_family'] }}
        private_ip: {{ ansible_facts['default_ipv4']['addresses'] }}
        private_ip: {{ ansible_facts.default_ipv4.addresses }}