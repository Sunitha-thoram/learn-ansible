- name: install nginx in redhat or ubuntu
  hosts: local
  become: yes
  connection: local
  tasks:
  - name: install nginx in redhat
  dnf:
    name: nginx
    state: present
  when: ansible_facts.os_family == 'Redhat'

  - name: install nginx in ubuntu
  apt:
    name: nginx
    state: present
  when: ansible_facts.os_family == 'Debain'
