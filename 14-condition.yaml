- name: Even or Odd
  hosts: local
  connection: local
  vars:
    given_number: 10
  tasks:
  - name: is Even
    debug:
      msg: " Given number {{ given_number}} is Even "
    when: given_number % 2 == 0

  - name: is Odd
    debug:
      msg: " Given number {{ given_number }} is Odd"
    when: given_number % 2 != 0