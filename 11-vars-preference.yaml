- name: variables from files
  hosts: local
  connection: local
  vars:
    course: "variables from play"
  vars_prompt:
  - name: course
    prompt: please enter your course   
    private: false
  vars_course:
  - course.yaml
  tasks:
  - name: print course information
    vars:
      course: "ansible from course"
    debug:
      msg: "hi, iam learning{{ course }}"

